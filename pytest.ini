; PARAPET test configuration.
;
; This repository is deliberately NOT a Python package: it is a website plus a
; set of vendored research snapshots. This file therefore configures pytest only
; and declares no packaging metadata. Import paths for the vendored source trees
; are set explicitly in tests/conftest.py.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    jvm: end-to-end test that shells out to javac/java; skipped when no JDK is present
