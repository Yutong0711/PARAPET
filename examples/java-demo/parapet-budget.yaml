# The example project's service budget.
#
# This is what a real one looks like. The two fields that make it worth
# anything are `authority` and `workloads`: without the first, anyone can
# lower the limit; without the second, "5%" is a number with no referent.

project: acme-demo
version: 1

authority: >-
  Changes to this file require approval from two maintainers and a note in
  the pull request naming the workload evidence that justified the new
  limit. Treat a change here the way you would treat a change to a signing
  key.

limits:
  latency: "5%"
  memory: "10%"

binding:
  - latency

workloads:
  - "bench/read-throughput"

notes: >-
  Baselines were taken on the read-throughput benchmark with a warm cache,
  averaged over five runs. The example ships one sample per side, which is
  why the record it produces comes back unscored rather than admitted.
