# PARAPET generation settings -- LONG-CONTEXT VARIANT, declared before any L1 run
# (evidence/DEVIATIONS.md D9). Identical to generation.yaml except the context
# length and the output budget, which the frozen settings cannot fit for L1's
# 1,347-line target file (~46 KB). Used only as a secondary L1 run; the frozen
# settings are run first and reported as the primary result.
version: 1
default_generator:
  product_name: parapet-local-qwen2.5-coder-7b-instruct-longctx
  model: qwen2.5-coder:7b-instruct-q4_K_M       # same model, same weights
  model_card: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct
  serving: ollama
  base_url: http://127.0.0.1:11436/v1           # a second loopback server with the larger context
  api_key: ollama
  server_env: {OLLAMA_CONTEXT_LENGTH: "32768", OLLAMA_HOST: "127.0.0.1:11436", OLLAMA_NO_CLOUD: "1"}
k: 5
temperature: 0.7
top_p: 0.95
seeds: [101, 102, 103, 104, 105]
max_tokens: 16384
request_timeout_s: 1200
max_retries: 1
client_max_retries: 0
prompt_template: parapet/prompts/harden_v1.txt
extraction_rule: parapet/extract.py (first closed fenced block declaring the target class)
transport_note: same as generation.yaml
hosted_controls: {}
