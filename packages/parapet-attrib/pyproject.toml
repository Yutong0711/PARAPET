[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parapet-attrib"
version = "0.1.0"
description = "Say where in the architecture a measured cost change landed"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The PARAPET Authors" }]
keywords = ["software performance", "profiling", "call graph", "software architecture", "java"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
record = ["parapet-record>=0.1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
parapet-attrib = "parapet_attrib.cli:main"

[project.urls]
Homepage = "https://github.com/Yutong0711/PARAPET"
Source = "https://github.com/Yutong0711/PARAPET"
Issues = "https://github.com/Yutong0711/PARAPET/issues"

[tool.setuptools.packages.find]
where = ["src"]
