[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parapet-record"
version = "0.1.0"
description = "The hardening-record schema shared by every PARAPET component"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The PARAPET Authors" }]
keywords = ["software performance", "supply chain security", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yutong0711/PARAPET"
Source = "https://github.com/Yutong0711/PARAPET"
Issues = "https://github.com/Yutong0711/PARAPET/issues"

[tool.setuptools.packages.find]
where = ["src"]
