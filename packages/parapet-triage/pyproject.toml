[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parapet-triage"
version = "0.1.0"
description = "Route issue reports and advisories with named linguistic patterns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The PARAPET Authors" }]
keywords = ["issue triage", "software performance", "security advisories", "text classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
learn = ["scikit-learn>=1.3", "numpy>=1.24"]
record = ["parapet-record>=0.1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "openpyxl>=3.1"]

[project.scripts]
parapet-triage = "parapet_triage.cli:main"

[project.urls]
Homepage = "https://github.com/Yutong0711/PARAPET"
Source = "https://github.com/Yutong0711/PARAPET"
Issues = "https://github.com/Yutong0711/PARAPET/issues"
Documentation = "https://github.com/Yutong0711/PARAPET/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parapet_triage = ["data/*.yaml"]
